name: aula-embarcacoes

services:
  banco:
    image: postgres:17
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: prova1
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: aula1234
    volumes:
      - dados-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d prova1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  app:
    build: .
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      SERVER_PORT: "8080"
      SPRING_DATASOURCE_URL: jdbc:postgresql://banco:5432/prova1
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: aula1234
    depends_on:
      banco:
        condition: service_healthy

volumes:
  dados-postgres:
